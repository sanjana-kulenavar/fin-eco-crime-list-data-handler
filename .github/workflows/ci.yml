name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync
      - name: Lint
        run: make lint
      - name: Test (coverage gate 80%)
        run: make test
      - name: Offline demo
        run: make demo
