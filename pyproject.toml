[project]
name = "sanctions-list-ops"
version = "1.0.0"
description = "A mini sanctions-list management pipeline: ingest, normalise, data-quality, deltas, screening exports and a screening-impact experiment."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "lxml>=5",
    "httpx>=0.27",
    "polars>=1.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "rapidfuzz>=3.6",
    "anyascii>=0.3",
    "pycountry>=23",
    "Faker>=25",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "streamlit>=1.35",
    "plotly>=5.20",
]

[project.scripts]
slo = "slo.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]  # B008: typer.Option defaults are idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["slo"]
omit = ["*/slo/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
